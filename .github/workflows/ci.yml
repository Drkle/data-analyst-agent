name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar bubblewrap (para el sondeo)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y bubblewrap
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest -q
      - name: Sondeo de aislamiento
        if: always()
        shell: bash
        run: |
          python -m data_analyst_agent.isolation_probe --github > sondeo.txt
          grep -v '^::notice' sondeo.txt | tee -a "$GITHUB_STEP_SUMMARY"
          grep '^::notice' sondeo.txt
