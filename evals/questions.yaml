# Preguntas de evaluación con respuesta esperada. Se ejecutan con evals/run_evals.py.
#
# Campos de cada caso: id, dataset, question, checks y, opcionales, sheet (hoja de un Excel),
# qa (prueba del informe de QA de la que sale el caso) y context (preguntas previas que se
# hacen antes, en la misma conversación, sin evaluarlas).
#
# El caso acierta si pasan todos sus `checks`. Los términos se comparan sin distinguir
# mayúsculas ni tildes, y al inicio de palabra ("cost" acepta "costos"):
#   numeric:        la respuesta contiene `value` (± `tolerance`), aceptando formatos como
#                   275 858,67 · 275.858,67 · 275858.67 · 275,9 mil
#   contains:       aparecen todos los `terms`
#   contains_any:   aparece al menos uno de los `terms`
#   excludes:       no aparece ninguno de los `terms`
#   not_computable: la respuesta dice que no se puede calcular (al menos una de `refusal_any`),
#                   menciona todo lo de `mentions_all` y no contiene nada de `must_not_contain`

- id: q01
  dataset: data/sample/ventas.csv
  question: "¿Qué región generó más ingresos?"
  checks:
    - {type: contains, terms: [Centro]}
    - {type: numeric, value: 275858.67, tolerance: 0.01}

- id: q02
  dataset: data/sample/ventas.csv
  question: "¿Cuánto ingreso generó cada región?"
  checks:
    - {type: numeric, value: 275858.67, tolerance: 0.01}  # Centro
    - {type: numeric, value: 192470.52, tolerance: 0.01}  # Sur
    - {type: numeric, value: 183995.19, tolerance: 0.01}  # Este
    - {type: numeric, value: 174832.83, tolerance: 0.01}  # Oeste
    - {type: numeric, value: 137929.22, tolerance: 0.01}  # Norte

- id: q03
  dataset: data/sample/ventas.csv
  question: "¿Cuál fue el mes con más ingresos?"
  checks:
    - {type: contains, terms: [febrero]}
    - {type: numeric, value: 132836.23, tolerance: 0.01}

- id: q04
  dataset: data/sample/ventas.csv
  question: "¿Cuál fue el mes con menos ingresos?"
  checks:
    - {type: contains, terms: [marzo]}
    - {type: numeric, value: 46658.94, tolerance: 0.01}

- id: q05
  dataset: data/sample/ventas.csv
  question: "¿Qué producto vendió más unidades?"
  checks:
    - {type: contains, terms: [Escritorio]}
    - {type: numeric, value: 629, tolerance: 0}

- id: q06
  dataset: data/sample/ventas.csv
  question: "¿Cuál fue la ganancia neta del año?"
  checks:
    - type: not_computable
      refusal_any: [no se puede, no es posible, no puedo, no permite, no hay datos, no contiene]
      mentions_all: [cost]
      # Frases que presentarían el ingreso como ganancia. La cifra 965 086,43 puede aparecer
      # si se ofrece como ingreso, así que no se busca la cifra.
      must_not_contain:
        - ganancia neta fue
        - ganancia neta es de
        - ganancia neta del año fue
        - ganancia neta asciende

- id: q07
  dataset: data/sample/ventas.csv
  question: "¿Cuántos clientes distintos compraron?"
  checks:
    - type: not_computable
      refusal_any: [no se puede, no es posible, no puedo, no permite, no hay datos, no contiene]
      mentions_all: [cliente]
      must_not_contain:
        - clientes distintos fueron
        - compraron 500 clientes
        - 500 clientes distintos
        - hubo 500 clientes

- id: q08
  dataset: data/sample/ventas.csv
  # Pregunta en la que el modelo inventó 7 de 12 cifras (solo había impreso head()).
  question: "Haz una gráfica de la evolución mensual de los ingresos"
  checks:
    - {type: numeric, value: 51697.33, tolerance: 0.01}  # enero
    - {type: numeric, value: 132836.23, tolerance: 0.01}  # febrero
    - {type: numeric, value: 46658.94, tolerance: 0.01}  # marzo
    - {type: numeric, value: 76086.18, tolerance: 0.01}  # abril
    - {type: numeric, value: 71926.73, tolerance: 0.01}  # mayo
    - {type: numeric, value: 89762.44, tolerance: 0.01}  # junio
    - {type: numeric, value: 105265.08, tolerance: 0.01}  # julio
    - {type: numeric, value: 93431.43, tolerance: 0.01}  # agosto
    - {type: numeric, value: 58804.72, tolerance: 0.01}  # septiembre
    - {type: numeric, value: 55761.56, tolerance: 0.01}  # octubre
    - {type: numeric, value: 76988.06, tolerance: 0.01}  # noviembre
    - {type: numeric, value: 105867.73, tolerance: 0.01}  # diciembre

- id: q09
  dataset: data/sample/ventas.csv
  # El modelo llegó a responder "93 unidades": 93 es el número de ventas (filas); las
  # unidades vendidas en el Norte son 897.
  question: "¿Cuántas ventas hubo en la región Norte?"
  checks:
    - {type: numeric, value: 93, tolerance: 0}
    - {type: contains, terms: [ventas]}
    - {type: excludes, terms: [93 unidades]}

- id: q10
  dataset: data/sample/ventas.csv
  # El dataset no indica moneda: el modelo llegó a responder "275.858,67 COP".
  question: "¿Cuánto ingreso generó la región Centro?"
  checks:
    - {type: numeric, value: 275858.67, tolerance: 0.01}
    - {type: excludes, terms: [COP]}
