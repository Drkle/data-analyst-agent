# El 1 de enero es festivo: la TRM de ese día viene de una fila cuya vigencia empieza antes. Buscar solo VIGENCIADESDE == 2025-01-01 da 0 filas.
- id: r-trm-01
  dataset: data/real/trm.csv
  question: ¿Cuál fue la TRM vigente el 1 de enero de 2025?
  checks:
  - type: numeric
    value: 4409.15
    tolerance: 0.01

# Rige desde 2025-04-10.
- id: r-trm-02
  dataset: data/real/trm.csv
  question: ¿Cuál fue la TRM más alta de 2025 y en qué mes?
  checks:
  - type: numeric
    value: 4416.69
    tolerance: 0.01
  - type: contains
    terms:
    - abril

# Rige desde 2025-12-25.
- id: r-trm-03
  dataset: data/real/trm.csv
  question: ¿Cuál fue la TRM más baja de 2025?
  checks:
  - type: numeric
    value: 3706.94
    tolerance: 0.01

# Pronóstico: los datos son históricos.
